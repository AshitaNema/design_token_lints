name: design_token_lints
description: >-
  Enforce your Flutter design system: flag raw colors, magic spacing, inline
  text styles and off-system widgets, auto-fix to your own tokens, and measure
  design-system coverage.
version: 0.2.0
repository: https://github.com/AshitaNema/design_token_lints
issue_tracker: https://github.com/AshitaNema/design_token_lints/issues
documentation: https://github.com/AshitaNema/design_token_lints#readme

screenshots:
  - description: A quick fix replacing a raw Color with the matching AppColors token in VS Code.
    path: doc/screenshot.png

topics:
  - lints
  - design-system
  - design-tokens
  - analyzer-plugin
  - flutter

environment:
  sdk: ^3.11.0

executables:
  design_token_lints:

dependencies:
  analysis_server_plugin: '>=0.3.15 <0.4.0'
  analyzer: '>=13.0.0 <15.0.0'
  analyzer_plugin: '>=0.14.9 <0.15.0'
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  analyzer_testing: '>=0.2.6 <0.5.0'
  lints: ^6.1.0
  test: ^1.25.0
  test_reflective_loader: ^0.6.0
