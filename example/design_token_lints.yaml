# The design system of acme_shop. See the package README for every option.
design_system:
  paths: [lib/design_system/**]

tokens:
  color:      { class: AppColors,     file: lib/design_system/app_colors.dart }
  spacing:    { class: AppSpacing,    file: lib/design_system/app_spacing.dart }
  radius:     { class: AppRadius,     file: lib/design_system/app_radius.dart }
  typography: { class: AppTypography, file: lib/design_system/app_typography.dart }
  shadow:     { class: AppShadows,    file: lib/design_system/app_shadows.dart }

allow:
  color: [Colors.transparent]
  spacing: [0]

matching:
  spacing_tolerance: 1
  color_delta_e: 2.0

components:
  ElevatedButton:
    replacement: AppButton
    import: package:acme_shop/design_system/app_button.dart
  Text:
    replacement: AppText
    import: package:acme_shop/design_system/app_text.dart

exclude: ["**/*.g.dart", "**/*.freezed.dart", "test/**"]
